name = "money-desk-watchman"
main = "src/index.ts"
compatibility_date = "2026-09-07"
workers_dev = true

[triggers]
crons = [ "*/15 * * * *" ]  # night-school + dreaming demoted 2026-09-08 — wealth filter

[[d1_databases]]
binding = "DB"
database_name = "money-desk-watchman-db"
database_id = "640e8406-f3b6-4a00-beb1-3ad05ceb92d9"
preview_database_id = "640e8406-f3b6-4a00-beb1-3ad05ceb92d9"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "ego-artifacts"

[vars]
DRIFT_PCT = "8"
WORKER_NAME = "money-desk-watchman"
BOOK_MARK_USD = "130"
# Set via `npx wrangler secret put HERMES_ENRICHER_URL` (not a plain var) once
# the hermes-enricher worker is deployed. Until then flags queue in D1.
